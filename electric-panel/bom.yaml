# BILL OF MATERIALS - ЭЛЕКТРИЧЕСКИЙ ЩИТ

# === ВВОДНЫЕ УСТРОЙСТВА ===
input_devices:
  - name: Реле
    type: Реле
    quantity: 1
    notes: "Реле для управления"

  - name: УЗО пожарное
    type: УЗО
    rating: "63A 300мА"
    quantity: 1
    notes: "Противопожарное УЗО селективное"

  - name: Автомат вводной
    type: Автомат
    rating: "C10"
    quantity: 1
    notes: "Вводной автоматический выключатель"

  - name: Контактор
    type: Контактор
    rating: "63-20"
    quantity: 1
    notes: "Контактор модульный"

  - name: Кросс-модуль
    type: Кросс-модуль
    rating: "4 полюса, 7 зажимов DIN-4"
    quantity: 1
    notes: "Распределительный кросс-модуль"

# === АВТОМАТИЧЕСКИЕ ВЫКЛЮЧАТЕЛИ С УЗО (АВДТ) ===
rcd_breakers:
  - name: АВДТ C16A 10мА
    type: Дифференциальный автомат
    rating: "C16A 10мА"
    quantity: 7
    lines: [1, 2, 4, 7, 8, 9]
    notes: "Автоматический выключатель с УЗО 10мА"

  - name: АВДТ C10A 10мА
    type: Дифференциальный автомат
    rating: "C10A 10мА"
    quantity: 1
    lines: [3]
    notes: "Автоматический выключатель с УЗО 10мА"

  - name: АВДТ C32A 30мА
    type: Дифференциальный автомат
    rating: "C32A 30мА"
    quantity: 1
    lines: [10]
    notes: "Автоматический выключатель с УЗО 30мА для варочной панели"

  - name: АВДТ C16A 30мА
    type: Дифференциальный автомат
    rating: "C16A 30мА"
    quantity: 1
    lines: [11]
    notes: "Автоматический выключатель с УЗО 30мА"

# === УЗО ГРУППОВЫЕ ===
group_rcds:
  - name: УЗО 63A 30мА
    type: УЗО
    rating: "63A 30мА"
    quantity: 2
    groups: ["Группа 2 (линии 12-19)", "Группа 3 (линии 20-26)"]
    notes: "УЗО для групп потребителей"

# === АВТОМАТИЧЕСКИЕ ВЫКЛЮЧАТЕЛИ (АВ) ===
circuit_breakers:
  - name: АВ C16
    type: Автоматический выключатель
    rating: "C16"
    quantity: 13
    lines: [5, 6, 12, 13, 14, 20, 21, 22, 23]
    notes: "Автоматический выключатель 16А"

  - name: АВ C10
    type: Автоматический выключатель
    rating: "C10"
    quantity: 9
    lines: [15, 16, 17, 18, 19, 24, 25, 26]
    notes: "Автоматический выключатель 10А для освещения"

